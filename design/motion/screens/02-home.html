<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BonSafar, accueil (motion reference)</title>
<!-- Motion reference for Cursor. Open in a browser to watch the loops. Layout, copy, timings and keyframes are the spec. -->
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&amp;family=Geist+Mono:wght@500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0B0B0F}a:hover{color:#0A6CFF}
@keyframes sFloat{0%,100%{transform:translateY(0) rotate(-12deg)}50%{transform:translateY(-8px) rotate(-8deg)}}
@keyframes sFlap{0%,100%{transform:rotate(0deg)}50%{transform:rotate(-18deg)}}
@keyframes sBlink{0%,90%,100%{transform:scaleY(1)}94%{transform:scaleY(0.15)}}
@keyframes sRing{0%{transform:scale(1);opacity:0.45}100%{transform:scale(2.2);opacity:0}}
@keyframes sSweep{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes sDrift{from{transform:translateX(-120px)}to{transform:translateX(470px)}}
@keyframes sIn{from{opacity:0;transform:translateY(8px) scale(0.96)}to{opacity:1;transform:none}}
.s-float{animation:sFloat 3.2s ease-in-out infinite}
.s-wing{animation:sFlap 0.9s ease-in-out infinite;transform-box:fill-box;transform-origin:100% 50%}
.s-eyes{animation:sBlink 4.5s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 50%}
.s-ring{animation:sRing 2.4s cubic-bezier(0.23,1,0.32,1) infinite}
.s-sweep{animation:sSweep 3s linear infinite}
.s-cloud1{animation:sDrift 40s linear infinite}
.s-cloud2{animation:sDrift 58s linear infinite;animation-delay:-24s}
.s-in{animation:sIn 0.5s cubic-bezier(0.23,1,0.32,1) both}
@media (prefers-reduced-motion: reduce){.s-float,.s-wing,.s-eyes,.s-ring,.s-sweep,.s-cloud1,.s-cloud2,.s-in{animation:none!important}}
</style>
<style>html,body{background:#E5E5EA} body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box}</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #F2F2F7; color: #0B0B0F; font-family: Geist, system-ui, sans-serif; display: flex; flex-direction: column">
  <div aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 390px; height: 520px; background: linear-gradient(180deg, #DCEBFF 0%, #EAF2FF 60%, #F2F2F7 100%)"></div>
  <svg class="s-cloud1" aria-hidden="true" width="90" height="34" viewBox="0 0 90 34" style="position: absolute; left: 0; top: 150px"><path d="M20 30h52a12 12 0 0 0 0-24 16 16 0 0 0-30-4A14 14 0 0 0 20 30z" fill="#FFFFFF"></path></svg>
  <svg class="s-cloud2" aria-hidden="true" width="60" height="22" viewBox="0 0 90 34" style="position: absolute; left: 0; top: 270px; opacity: 0.8"><path d="M20 30h52a12 12 0 0 0 0-24 16 16 0 0 0-30-4A14 14 0 0 0 20 30z" fill="#FFFFFF"></path></svg>

      <span class="s-ring" style="position: absolute; inset: 0; border-radius: 999px; border: 2px solid #0A6CFF; animation-delay: 1.6s"></span>
      <span class="s-sweep" style="position: absolute; left: -60px; top: -60px; width: 216px; height: 216px; border-radius: 999px; background: conic-gradient(from 0deg, rgba(10,108,255,0.16), rgba(10,108,255,0) 70deg, rgba(10,108,255,0) 360deg)"></span>

        <path class="s-wing" d="M54,84 C42,78 24,76 12,82 C9,88 12,94 18,95 C14,100 17,106 25,106 C23,111 28,115 35,114 C42,113 49,108 54,104 Z" fill="#FFFFFF" stroke="#0B0B0F" stroke-width="7" stroke-linejoin="round"></path>

        <path d="M88,104 Q99,116 110,104" fill="none" stroke="#0B0B0F" stroke-width="6" stroke-linecap="round"></path>
      </svg>
    </div>
    <div class="s-in" style="position: absolute; right: 22px; top: 36px; padding: 8px 12px; background: #FFFFFF; border-radius: 14px 14px 14px 4px; box-shadow: 0 1px 2px rgba(0,0,0,.06), 0 8px 24px rgba(0,0,0,.06)">

    </div>

    <div style="display: flex; gap: 12px; padding: 0 24px; overflow: hidden">

        <div style="height: 92px; background: linear-gradient(160deg, #FFC800, #F59E0B 60%, #0A6CFF); display: flex; align-items: flex-end; padding: 8px; box-sizing: border-box"><span style="font-family: 'Geist Mono', monospace; font-size: 10px; font-weight: 600; background: rgba(255,255,255,0.9); padding: 2px 6px; border-radius: 6px">MUSE IMAGE</span></div>
        <div style="padding: 10px 12px 12px 12px"><p style="margin: 0; font-size: 15px; font-weight: 700">Istanbul</p><p style="margin: 2px 0 0 0; font-size: 12px; color: #15803D; font-weight: 600">Sans visa · 4 h 40</p></div>
      </article>
      <article style="flex-shrink: 0; width: 150px; background: #FFFFFF; border-radius: 22px; overflow: hidden; box-shadow: 0 1px 2px rgba(0,0,0,.06), 0 8px 24px rgba(0,0,0,.06)">
        <div style="height: 92px; background: linear-gradient(160deg, #D4E8F6, #0A6CFF 70%, #0B3D91); display: flex; align-items: flex-end; padding: 8px; box-sizing: border-box"><span style="font-family: 'Geist Mono', monospace; font-size: 10px; font-weight: 600; background: rgba(255,255,255,0.9); padding: 2px 6px; border-radius: 6px">MUSE IMAGE</span></div>
        <div style="padding: 10px 12px 12px 12px"><p style="margin: 0; font-size: 15px; font-weight: 700">Tunis</p><p style="margin: 2px 0 0 0; font-size: 12px; color: #15803D; font-weight: 600">Sans visa · vol direct</p></div>
      </article>

        <div style="height: 92px; background: linear-gradient(160deg, #EEF1E6, #15803D 75%); display: flex; align-items: flex-end; padding: 8px; box-sizing: border-box"><span style="font-family: 'Geist Mono', monospace; font-size: 10px; font-weight: 600; background: rgba(255,255,255,0.9); padding: 2px 6px; border-radius: 6px">MUSE IMAGE</span></div>

  <div style="flex: 1"></div>
  <div style="position: relative; padding: 0 20px 22px 20px">
