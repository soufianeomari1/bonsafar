<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BonSafar, choix de la langue (motion reference)</title>
<!-- Motion reference for Cursor. Open in a browser to watch the loops. Layout, copy, timings and keyframes are the spec. -->
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&amp;family=Geist+Mono:wght@500;600&amp;family=IBM+Plex+Sans+Arabic:wght@500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0B0B0F}a:hover{color:#0A6CFF}
@keyframes sFloat{0%,100%{transform:translateY(0) rotate(-12deg)}50%{transform:translateY(-8px) rotate(-8deg)}}
@keyframes sFlap{0%,100%{transform:rotate(0deg)}50%{transform:rotate(-18deg)}}
@keyframes sBlink{0%,90%,100%{transform:scaleY(1)}94%{transform:scaleY(0.15)}}
@keyframes sIn{from{opacity:0;transform:translateY(8px) scale(0.96)}to{opacity:1;transform:none}}
@keyframes sDrift{from{transform:translateX(-120px)}to{transform:translateX(470px)}}
.s-float{animation:sFloat 3.2s ease-in-out infinite}
.s-wing{animation:sFlap 0.9s ease-in-out infinite;transform-box:fill-box;transform-origin:100% 50%}
.s-eyes{animation:sBlink 4.5s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 50%}
.s-in{animation:sIn 0.5s cubic-bezier(0.23,1,0.32,1) both}
.s-cloud{animation:sDrift 44s linear infinite}
@media (prefers-reduced-motion: reduce){.s-float,.s-wing,.s-eyes,.s-in,.s-cloud{animation:none!important}}
</style>
<style>html,body{background:#E5E5EA} body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box}</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #F2F2F7; color: #0B0B0F; font-family: Geist, system-ui, sans-serif; display: flex; flex-direction: column">
  <div aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 390px; height: 320px; background: linear-gradient(180deg, #DCEBFF 0%, #F2F2F7 100%)"></div>
  <svg class="s-cloud" aria-hidden="true" width="80" height="30" viewBox="0 0 90 34" style="position: absolute; left: 0; top: 120px"><path d="M20 30h52a12 12 0 0 0 0-24 16 16 0 0 0-30-4A14 14 0 0 0 20 30z" fill="#FFFFFF"></path></svg>

  <div style="position: relative; display: flex; align-items: center; gap: 12px; padding: 18px 20px 0 20px">
    <button type="button" aria-label="Retour" style="width: 44px; height: 44px; border-radius: 999px; border: 0; background: #FFFFFF; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0B0B0F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg>
    </button>
    <div aria-label="Étape 1 sur 4" style="flex: 1; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px">
      <span style="height: 6px; border-radius: 999px; background: #0B0B0F"></span>
      <span style="height: 6px; border-radius: 999px; background: #FFFFFF"></span>
      <span style="height: 6px; border-radius: 999px; background: #FFFFFF"></span>
      <span style="height: 6px; border-radius: 999px; background: #FFFFFF"></span>
    </div>
    <a href="#" style="font-size: 15px; font-weight: 600; color: #6B6B76; text-decoration: none">Passer</a>
  </div>

  <div style="position: relative; display: flex; align-items: flex-end; gap: 10px; padding: 26px 20px 0 16px">
    <div class="s-float" style="width: 96px; height: 96px; flex-shrink: 0">
      <svg role="img" aria-label="Safar te pose la question" width="96" height="96" viewBox="0 0 200 200">
        <g transform="translate(200,-10) scale(-1,1)"><path class="s-wing" d="M54,84 C42,78 24,76 12,82 C9,88 12,94 18,95 C14,100 17,106 25,106 C23,111 28,115 35,114 C42,113 49,108 54,104 Z" fill="#FFFFFF" stroke="#0B0B0F" stroke-width="7" stroke-linejoin="round"></path></g>
        <path class="s-wing" d="M54,84 C42,78 24,76 12,82 C9,88 12,94 18,95 C14,100 17,106 25,106 C23,111 28,115 35,114 C42,113 49,108 54,104 Z" fill="#FFFFFF" stroke="#0B0B0F" stroke-width="7" stroke-linejoin="round"></path>
        <path d="M80,45 H120 A30,30 0 0 1 150,75 V105 A30,30 0 0 1 130,131 L140,160 Q118,156 108,135 H80 A30,30 0 0 1 50,105 V75 A30,30 0 0 1 80,45 Z" fill="#0A6CFF" stroke="#0B0B0F" stroke-width="7" stroke-linejoin="round"></path>
        <g class="s-eyes"><path d="M74,89 Q82,78 90,89 M108,89 Q116,78 124,89" fill="none" stroke="#0B0B0F" stroke-width="6" stroke-linecap="round"></path></g>
        <path d="M88,104 Q99,116 110,104" fill="none" stroke="#0B0B0F" stroke-width="6" stroke-linecap="round"></path>
      </svg>
    </div>
    <div class="s-in" style="flex: 1; padding: 14px 16px; background: #FFFFFF; border-radius: 22px 22px 22px 6px; box-shadow: 0 1px 2px rgba(0,0,0,.06), 0 8px 24px rgba(0,0,0,.06); margin-bottom: 14px">
      <p style="margin: 0; font-size: 18px; font-weight: 700; line-height: 1.3">Salam ! B ach t7eb nhdro ?</p>
      <p style="margin: 4px 0 0 0; font-size: 14px; color: #6B6B76">Tu préfères qu'on parle en…</p>
    </div>
  </div>

  <div role="radiogroup" aria-label="Langue" style="position: relative; display: flex; flex-direction: column; gap: 10px; padding: 20px 20px 0 20px">
    <button type="button" role="radio" aria-checked="true" class="s-in" style="height: 64px; border-radius: 18px; border: 2px solid #0B0B0F; background: #FFFFFF; padding: 0 16px; display: flex; align-items: center; justify-content: space-between; font-family: inherit; text-align: left">
      <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 16px; font-weight: 700; color: #0B0B0F">Darija</span><span style="font-size: 13px; color: #6B6B76">Salam, labas ? · lettres latines</span></span>
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="#0B0B0F"></circle><path d="M7 12.5l3.2 3.2L17 9" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></path></svg>
    </button>
    <button type="button" role="radio" aria-checked="false" class="s-in" style="height: 64px; border-radius: 18px; border: 1px solid #E5E5EA; background: #FFFFFF; padding: 0 16px; display: flex; align-items: center; justify-content: space-between; font-family: inherit; animation-delay: 0.05s">
      <span style="display: flex; flex-direction: column; gap: 2px; text-align: left"><span style="font-size: 16px; font-weight: 700; color: #0B0B0F">Darija</span><span lang="ar" dir="rtl" style="font-family: 'IBM Plex Sans Arabic', sans-serif; font-size: 14px; color: #6B6B76; line-height: 1.6">سلام، لاباس؟ · حروف عربية</span></span>
      <span aria-hidden="true" style="width: 22px; height: 22px; border-radius: 999px; border: 2px solid #E5E5EA"></span>
    </button>
    <button type="button" role="radio" aria-checked="false" class="s-in" style="height: 64px; border-radius: 18px; border: 1px solid #E5E5EA; background: #FFFFFF; padding: 0 16px; display: flex; align-items: center; justify-content: space-between; font-family: inherit; animation-delay: 0.1s">
      <span style="display: flex; flex-direction: column; gap: 2px; text-align: left"><span style="font-size: 16px; font-weight: 700; color: #0B0B0F">Français</span><span style="font-size: 13px; color: #6B6B76">Bonjour, ça va ?</span></span>
      <span aria-hidden="true" style="width: 22px; height: 22px; border-radius: 999px; border: 2px solid #E5E5EA"></span>
    </button>
    <button type="button" role="radio" aria-checked="false" class="s-in" style="height: 64px; border-radius: 18px; border: 1px solid #E5E5EA; background: #FFFFFF; padding: 0 16px; display: flex; align-items: center; justify-content: space-between; font-family: inherit; animation-delay: 0.15s">
      <span style="display: flex; flex-direction: column; gap: 2px; text-align: left"><span lang="ar" style="font-family: 'IBM Plex Sans Arabic', sans-serif; font-size: 16px; font-weight: 600; color: #0B0B0F">العربية</span><span lang="ar" dir="rtl" style="font-family: 'IBM Plex Sans Arabic', sans-serif; font-size: 13px; color: #6B6B76; line-height: 1.6">مرحبا، كيف حالك؟</span></span>
      <span aria-hidden="true" style="width: 22px; height: 22px; border-radius: 999px; border: 2px solid #E5E5EA"></span>
    </button>
    <button type="button" role="radio" aria-checked="false" class="s-in" style="height: 64px; border-radius: 18px; border: 1px solid #E5E5EA; background: #FFFFFF; padding: 0 16px; display: flex; align-items: center; justify-content: space-between; font-family: inherit; animation-delay: 0.2s">
      <span style="display: flex; flex-direction: column; gap: 2px; text-align: left"><span style="font-size: 16px; font-weight: 700; color: #0B0B0F">English</span><span style="font-size: 13px; color: #6B6B76">Hi, how are you?</span></span>
      <span aria-hidden="true" style="width: 22px; height: 22px; border-radius: 999px; border: 2px solid #E5E5EA"></span>
    </button>
  </div>

  <div style="flex: 1"></div>
  <div style="position: relative; padding: 0 20px 22px 20px; display: flex; flex-direction: column; gap: 10px">
    <p style="margin: 0; text-align: center; font-size: 13px; color: #6B6B76">Tu pourras changer ça à tout moment dans ton profil.</p>
    <button type="button" style="height: 56px; border: 0; border-radius: 16px; background: #0B0B0F; color: #FFFFFF; font-family: inherit; font-size: 17px; font-weight: 700">Suivant</button>
  </div>
</div>
</body>
</html>
