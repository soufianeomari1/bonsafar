<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>BonSafar, dossier de voyage</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&amp;family=Geist+Mono:wght@400;500;600;700&amp;family=IBM+Plex+Sans+Arabic:wght@400;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
@keyframes print{0%{transform:translateY(-100%)}8%{transform:translateY(-80%)}14%{transform:translateY(-80%)}22%{transform:translateY(-55%)}28%{transform:translateY(-55%)}36%{transform:translateY(-28%)}42%{transform:translateY(-28%)}50%,100%{transform:translateY(0)}}
@keyframes thump{0%,56%{transform:scale(1.6) rotate(-28deg);opacity:0}62%{transform:scale(.92) rotate(-12deg);opacity:1}67%,100%{transform:scale(1) rotate(-12deg);opacity:1}}
@keyframes ink{0%,60%{transform:scale(.6);opacity:0}64%{opacity:.35}80%,100%{transform:scale(1.5);opacity:0}}
@media (prefers-reduced-motion: reduce){.a{animation:none!important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F2F2F7; color: #0B0B0F; font-family: Geist, system-ui, sans-serif; position: relative; overflow: hidden; display: flex; flex-direction: column; padding: 20px 16px 20px; gap: 14px">
  <div style="display: flex; flex-direction: column; gap: 2px">
    <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.08em; color: #15803D">DOSSIER PRÊT</span>
    <h1 style="margin: 0; font-weight: 800; font-size: 30px; letter-spacing: -0.02em">Trik slama, Fatima !</h1>
    <span style="font-size: 15px; color: #6B6B76">Bon voyage. Tout est au même endroit.</span>
  </div>

  <div style="background: #FFFFFF; border-radius: 24px; padding: 14px 14px 0; display: flex; flex-direction: column; align-items: center; gap: 0; box-shadow: 0 1px 2px rgba(0,0,0,0.05)">
    <span style="font-size: 11px; font-weight: 700; letter-spacing: 0.1em; color: #6B6B76; padding-bottom: 8px">CARTE D'EMBARQUEMENT · ALLER</span>
    <span aria-hidden="true" style="width: 100%; height: 10px; border-radius: 6px; background: #0B0B0F; box-shadow: inset 0 -3px 0 #3A3A42"></span>
    <div style="position: relative; width: 100%; height: 292px; overflow: hidden">
      <article class="a" aria-label="Carte d'embarquement Casablanca vers Istanbul" style="position: absolute; left: 10px; right: 10px; top: 0; height: 270px; border-radius: 0 0 18px 18px; background: #FFFDF8; border: 1px solid #E5E5EA; border-top: 0; display: grid; grid-template-rows: 116px minmax(0, 1fr); overflow: hidden; animation: print 6s cubic-bezier(.3,0,.2,1) infinite; box-shadow: 0 10px 24px rgba(0,0,0,0.08)">
        <div style="display: grid; grid-template-columns: 150px minmax(0, 1fr)">
          <div style="background: #15803D; color: #FFFFFF; padding: 12px 14px; display: flex; flex-direction: column; justify-content: center">
            <span style="font-weight: 800; font-size: 40px; line-height: 0.95; letter-spacing: -0.02em">CMN</span>
            <span style="font-weight: 800; font-size: 40px; line-height: 0.95; letter-spacing: -0.02em">→SAW</span>
          </div>
          <div style="padding: 12px; display: flex; flex-direction: column; gap: 2px; font-family: 'Geist Mono', monospace">
            <span style="font-size: 10px; color: #6B6B76">MADE WITH BONSAFAR</span>
            <span style="font-size: 15px; font-weight: 700">FATIMA</span>
            <span style="font-size: 11px; color: #6B6B76">AT972 · PC1102</span>
            <span style="font-size: 11px; color: #6B6B76">via MADRID</span>
          </div>
        </div>
        <div style="border-top: 2px dashed #E5E5EA; padding: 12px 14px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)) 64px; gap: 6px; align-items: start; font-family: 'Geist Mono', monospace">
          <span style="display: flex; flex-direction: column"><span style="font-size: 10px; color: #6B6B76">DATE</span><span style="font-size: 15px; font-weight: 700">15 DÉC</span></span>
          <span style="display: flex; flex-direction: column"><span style="font-size: 10px; color: #6B6B76">DÉPART</span><span style="font-size: 15px; font-weight: 700">09:15</span></span>
          <span style="display: flex; flex-direction: column"><span style="font-size: 10px; color: #6B6B76">SIÈGE</span><span style="font-size: 13px; font-weight: 700">À CHOISIR</span></span>
          <span aria-hidden="true" style="width: 64px; height: 64px; display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 1px">
            <sc-for list="{{ qr }}" as="q" hint-placeholder-count="64">
              <span style="background: {{ q.c }}"></span>
            </sc-for>
          </span>
          <span style="grid-column: 1 / 4; font-size: 10px; color: #6B6B76; font-family: Geist, sans-serif">Exemple de démo. La vraie carte vient de la compagnie.</span>
        </div>
      </article>
      <span class="a" aria-hidden="true" style="position: absolute; right: 22px; bottom: 6px; width: 104px; height: 104px; border-radius: 50%; border: 6px solid rgba(193,39,45,0.35); animation: ink 6s ease-out infinite"></span>
      <svg class="a" role="img" aria-label="Tampon Rihla" width="104" height="104" viewBox="0 0 104 104" style="position: absolute; right: 22px; bottom: 6px; animation: thump 6s cubic-bezier(.3,1.4,.4,1) infinite">
        <circle cx="52" cy="52" r="47" fill="none" stroke="#C1272D" stroke-width="4"></circle>
        <circle cx="52" cy="52" r="40" fill="none" stroke="#C1272D" stroke-width="1.5"></circle>
        <polygon points="52,22 57.5,37 73,37 60.5,46.5 65,62 52,52.5 39,62 43.5,46.5 31,37 46.5,37" fill="none" stroke="#006233" stroke-width="2.5" stroke-linejoin="round"></polygon>
        <text x="52" y="78" text-anchor="middle" font-family="IBM Plex Sans Arabic, sans-serif" font-size="15" font-weight="600" fill="#C1272D">رحلة</text>
        <text x="52" y="91" text-anchor="middle" font-family="Geist Mono, monospace" font-size="7" letter-spacing="1.2" fill="#C1272D">IST · 2026</text>
      </svg>
    </div>
  </div>

  <div style="background: #FFFFFF; border-radius: 20px; padding: 2px 14px">
    <sc-for list="{{ items }}" as="i" hint-placeholder-count="3">
      <div style="display: grid; grid-template-columns: 32px minmax(0, 1fr) 16px; gap: 10px; align-items: center; padding: 10px 0; border-top: {{ i.border }}">
        <span aria-hidden="true" style="width: 32px; height: 32px; border-radius: 50%; background: {{ i.bg }}; color: {{ i.fg }}; display: flex; align-items: center; justify-content: center"><svg width="17" height="17" viewBox="0 0 256 256" fill="currentColor"><path d="{{ i.icon }}"></path></svg></span>
        <span style="display: flex; flex-direction: column"><span style="font-weight: 700; font-size: 15px">{{ i.t }}</span><span style="font-size: 13px; color: #6B6B76">{{ i.s }}</span></span>
        <svg width="14" height="14" viewBox="0 0 256 256" fill="#C7C7CC" aria-hidden="true" style="transform: rotate(180deg)"><path d="M168.49,199.51a12,12,0,0,1-17,17l-80-80a12,12,0,0,1,0-17l80-80a12,12,0,0,1,17,17L97,128Z"></path></svg>
      </div>
    </sc-for>
  </div>

  <div style="flex: 1"></div>
  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
    <a href="Rihla.dc.html" style="height: 56px; border-radius: 16px; background: #0B0B0F; color: #FFFFFF; font: 600 16px Geist, sans-serif; text-decoration: none; display: flex; align-items: center; justify-content: center">Voir l'affiche</a>
    <button type="button" style="height: 56px; border-radius: 16px; border: 0; background: #0A6CFF; color: #FFFFFF; font: 600 16px Geist, sans-serif; display: flex; align-items: center; justify-content: center; gap: 8px"><svg width="18" height="18" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M220,112v96a20,20,0,0,1-20,20H56a20,20,0,0,1-20-20V112A20,20,0,0,1,56,92H76a12,12,0,0,1,0,24H60v88H196V116H180a12,12,0,0,1,0-24h20A20,20,0,0,1,220,112ZM96.49,72.49,116,53v83a12,12,0,0,0,24,0V53l19.51,19.52a12,12,0,1,0,17-17l-40-40a12,12,0,0,0-17,0l-40,40a12,12,0,1,0,17,17Z"></path></svg>Partager</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const qr = [];
    let s = 11;
    for (let i = 0; i < 64; i++) {
      const r = i % 8, c = Math.floor(i / 8);
      const corner = (r < 2 && c < 2) || (r > 5 && c < 2) || (r < 2 && c > 5);
      s = (s * 37 + 13) % 101;
      qr.push({ c: corner || s % 2 === 0 ? '#0B0B0F' : 'transparent' });
    }
    const P = {
      ticket: 'M232,104a8,8,0,0,0,8-8V64a16,16,0,0,0-16-16H32A16,16,0,0,0,16,64V96a8,8,0,0,0,8,8,24,24,0,0,1,0,48,8,8,0,0,0-8,8v32a16,16,0,0,0,16,16H224a16,16,0,0,0,16-16V160a8,8,0,0,0-8-8,24,24,0,0,1,0-48ZM32,167.2a40,40,0,0,0,0-78.4V64H88V192H32Z',
      bed: 'M216,72H32V48a8,8,0,0,0-16,0V208a8,8,0,0,0,16,0V176H240v32a8,8,0,0,0,16,0V112A40,40,0,0,0,216,72ZM32,88h72v72H32Z',
      seal: 'M128,24A104,104,0,1,0,232,128,104.11,104.11,0,0,0,128,24Zm45.66,85.66-56,56a8,8,0,0,1-11.32,0l-24-24a8,8,0,0,1,11.32-11.32L112,148.69l50.34-50.35a8,8,0,0,1,11.32,11.32Z'
    };
    const items = [
      { t: 'Retour · mar. 22 déc.', s: 'SAW 20:50 → CMN 23:05 · direct', icon: P.ticket, bg: '#EAF2FF', fg: '#0A6CFF', border: '0' },
      { t: 'Hampton by Hilton Şişli', s: '7 nuits · petit déjeuner inclus', icon: P.bed, bg: '#FFF4E0', fg: '#B45309', border: '1px solid #E5E5EA' },
      { t: 'Prêt à partir', s: 'Pas de visa · 1 chose à faire', icon: P.seal, bg: '#E8F7EE', fg: '#15803D', border: '1px solid #E5E5EA' }
    ];
    return { qr, items };
  }
}
</script>
</body>
</html>
